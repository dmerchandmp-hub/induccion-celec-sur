<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Retos de la Calidad · CELEC SUR 2026</title>
<meta name="theme-color" content="#0A2463">
<style>
:root{--navy:#0A2463;--navy2:#13337f;--gold:#F2B705;--red:#D7263D;--green:#1B998B;--bg:#0A2463;--card:#ffffff;--ink:#14213d;--muted:#5b6b8c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#0A2463 0%,#13337f 60%,#1d4aa8 100%);color:#fff}
body{min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
header{text-align:center;margin-bottom:14px}
header .logo{display:block;margin:0 auto 6px;width:150px;height:auto}header .logo.big{width:min(260px,70vw);margin-bottom:10px}
header .slogan{font-style:italic;font-size:13px;opacity:.9;margin:-2px 0 10px}
header .kick{color:var(--gold);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
header h1{margin:6px 0 2px;font-size:24px}
header p{margin:0;opacity:.8;font-size:13px}
.card{background:var(--card);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:14px}
.game-link{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink)}
.game-link .ico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;flex:none}
.game-link h3{margin:0 0 3px;font-size:17px}
.game-link p{margin:0;font-size:13px;color:var(--muted)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--muted)}
input,select{width:100%;padding:12px;border:1.5px solid #d5dbea;border-radius:12px;font-size:16px;color:var(--ink);background:#fff}
input:focus,select:focus{outline:none;border-color:var(--navy2)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--gold);color:var(--navy);margin-top:14px;cursor:pointer}
.btn.sec{background:#eef1f8;color:var(--navy)}
.btn:active{transform:scale(.98)}
.hud{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.hud .t{font-variant-numeric:tabular-nums;font-size:20px;color:var(--gold)}
.hud small{opacity:.8;font-weight:600}
.q{font-size:18px;font-weight:700;margin:0 0 14px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border-radius:12px;border:1.5px solid #d5dbea;background:#fff;font-size:15px;color:var(--ink);cursor:pointer}
.opt.ok{background:#d9f5ef;border-color:var(--green)}
.opt.bad{background:#fde2e5;border-color:var(--red)}
.bar{height:6px;background:#e7ebf5;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{aspect-ratio:3/4;border-radius:12px;border:0;font-size:13px;font-weight:700;padding:6px;cursor:pointer;background:var(--navy2);color:#fff;position:relative;line-height:1.2}
.mc.back::after{content:"?";font-size:30px;color:var(--gold)}
.mc.back span{display:none}
.mc.up{background:#fff;color:var(--navy);border:2px solid var(--gold)}
.mc.done{background:#d9f5ef;color:#0f5e55;border:2px solid var(--green)}
.mc .tag{display:block;font-size:10px;font-weight:600;opacity:.7;margin-top:4px}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:48px;margin:14px 0}
.slot{width:38px;height:46px;border-radius:10px;background:#eef1f8;border:2px dashed #b9c3dc;display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--navy)}
.slot.f{border-style:solid;border-color:var(--navy2);background:#fff}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:44px;height:50px;border-radius:12px;border:0;background:var(--navy);color:#fff;font-size:22px;font-weight:800;cursor:pointer}
.tile.used{opacity:.2;pointer-events:none}
.hint{background:#fff7d6;border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:6px}
.row{display:flex;gap:8px}
.row .btn{margin-top:10px;font-size:14px;padding:12px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.res{text-align:center}
.res .big{font-size:44px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;margin:6px 0}
.res .code{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;font-weight:800;letter-spacing:.12em;background:var(--navy);color:var(--gold);padding:8px 14px;border-radius:10px;margin:8px 0}
.res table{width:100%;font-size:14px;margin:10px 0;border-collapse:collapse}
.res td{padding:6px 4px;border-bottom:1px solid #eef1f8;text-align:left}
.res td:last-child{text-align:right;font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.foot{text-align:center;font-size:11px;opacity:.6;margin-top:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.hidden{display:none}
.cw{display:grid;gap:4px;margin:0 auto 12px;width:100%;max-width:340px}
.cw .cl{position:relative;aspect-ratio:1}
.cw .cl.x{visibility:hidden}
.cw input{position:absolute;inset:0;width:100%;height:100%;padding:0;text-align:center;font-size:22px;font-weight:800;text-transform:uppercase;border:2px solid #b9c3dc;border-radius:9px;color:var(--navy);caret-color:transparent}
.cw input.sel{background:#fff7d6;border-color:var(--gold)}
.cw input.cur{border-color:var(--navy2);box-shadow:0 0 0 2px var(--navy2) inset}
.cw input.bad{background:#fde2e5;border-color:var(--red)}
.cw input.ok{background:#d9f5ef;border-color:var(--green);color:#0f5e55}
.cw .num{position:absolute;top:2px;left:4px;font-size:10px;font-weight:700;color:var(--muted);z-index:1;pointer-events:none}
.clues{list-style:none;padding:0;margin:0}
.clues li{padding:10px 12px;border-radius:10px;margin:6px 0;background:#eef1f8;font-size:14px;cursor:pointer}
.clues li.on{background:#fff7d6;outline:2px solid var(--gold)}
.clues b{color:var(--navy2)}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:8;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
</style>
</head>

/* ---------- TRIVIA ---------- */
function trivia(){
 const qs=shuffle(TRIVIA).slice(0,3).map(([q,o])=>({q,ok:o[0],opts:shuffle(o)}));
 let i=0,errs=0;
 app.innerHTML=hud("trivia","1/3")+`<div class="card"><div class="bar"><i id="pb"></i></div><div id="qa"></div></div>`;
 startClock();
 const show=()=>{const Q=qs[i];$("#ex").textContent=(i+1)+"/3";$("#pb").style.width=(i*100/3)+"%";
  $("#qa").innerHTML=`<p class="q">${Q.q}</p>`+Q.opts.map(o=>`<button class="opt">${o}</button>`).join("");
  let locked=false;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;locked=true;
   if(b.textContent===Q.ok){b.classList.add("ok")}else{b.classList.add("bad");errs++;addPen(5000);document.querySelectorAll(".opt").forEach(x=>{if(x.textContent===Q.ok)x.classList.add("ok")})}
   setTimeout(()=>{i++;if(i<3)show();else finish("trivia",{"Aciertos":(3-errs)+" de 3","Penalización":"+"+errs*5+" s"},(3-errs)+"/3")},650)})};
 show();
}

/* ---------- MEMORIA ---------- */
function memoria(){
 const cards=shuffle(shuffle(MEMO).slice(0,3).flatMap(([a,b],k)=>[{k,t:a,tag:"norma / herramienta"},{k,t:b,tag:"tema"}]));
 let open=[],pairs=0,fails=0,busy=false;
 app.innerHTML=hud("memoria","0/3")+`<div class="card"><div class="grid">${cards.map((c,i)=>`<button class="mc back" data-i="${i}"><span>${c.t}<span class="tag">${c.tag}</span></span></button>`).join("")}</div></div>`;
 startClock();
 document.querySelectorAll(".mc").forEach(b=>b.onclick=()=>{
  if(busy||!b.classList.contains("back"))return;
  b.classList.remove("back");b.classList.add("up");open.push(b);
  if(open.length<2)return;
  const [x,y]=open;const cx=cards[x.dataset.i],cy=cards[y.dataset.i];
  if(cx.k===cy.k){x.classList.replace("up","done");y.classList.replace("up","done");open=[];pairs++;$("#ex").textContent=pairs+"/3";
   if(pairs===3)setTimeout(()=>finish("memoria",{"Parejas":"3 de 3","Intentos fallidos":fails,"Penalización":"+"+fails+" s"},"3/3"),400)}
  else{busy=true;fails++;addPen(1000);setTimeout(()=>{x.classList.remove("up");y.classList.remove("up");x.classList.add("back");y.classList.add("back");open=[];busy=false},800)}
 });
}

/* ---------- PALABRAS ---------- */
function palabras(){
 const set=shuffle(PALABRAS).slice(0,3);
 let i=0,stats={errores:0,pistas:0,saltos:0};
 app.innerHTML=hud("palabras","1/3")+`<div class="card" id="pz"></div>`;
 startClock();
 const show=()=>{
  const [w,def]=set[i];$("#ex").textContent=(i+1)+"/3";
  let letters;do{letters=shuffle(w.split(""))}while(letters.join("")===w);
  let built=[],fixed=0;
  const pz=$("#pz");
  pz.innerHTML=`<div class="hint">${def}</div><div class="slots" id="sl">${w.split("").map(()=>`<div class="slot"></div>`).join("")}</div>
  <div class="tiles">${letters.map((l,j)=>`<button class="tile" data-j="${j}">${l}</button>`).join("")}</div>
  <div class="row"><button class="btn sec" id="bk">Borrar</button><button class="btn sec" id="hn">Pista +5 s</button><button class="btn sec" id="sk">Saltar +20 s</button></div>`;
  const slots=[...pz.querySelectorAll(".slot")],tiles=[...pz.querySelectorAll(".tile")];
  const paint=()=>{slots.forEach((s,k)=>{s.textContent=built[k]?built[k].l:"";s.classList.toggle("f",!!built[k]);s.style.background=k<fixed?"#d9f5ef":""});tiles.forEach(t=>t.classList.toggle("used",built.some(b=>b&&b.j==t.dataset.j)))};
  const next=()=>{i++;if(i<3)show();else finish("palabras",{"Palabras":"3","Errores":stats.errores+" (+"+stats.errores*3+" s)","Pistas":stats.pistas+" (+"+stats.pistas*5+" s)","Saltos":stats.saltos+" (+"+stats.saltos*20+" s)"},(3-stats.saltos)+"/3")};
  tiles.forEach(t=>t.onclick=()=>{if(built.length>=w.length)return;built.push({l:t.textContent,j:t.dataset.j});paint();
   if(built.length===w.length){if(built.map(b=>b.l).join("")===w){slots.forEach(s=>s.style.background="#d9f5ef");setTimeout(next,450)}
    else{stats.errores++;addPen(3000);$("#sl").classList.add("shake");setTimeout(()=>{$("#sl").classList.remove("shake");built=built.slice(0,fixed);paint()},400)}}});
  $("#bk").onclick=()=>{if(built.length>fixed){built.pop();paint()}};
  $("#hn").onclick=()=>{if(fixed>=w.length-1)return;stats.pistas++;addPen(5000);
   built=built.slice(0,fixed);const need=w[fixed];const t=tiles.find(t=>t.textContent===need&&!built.some(b=>b.j==t.dataset.j));built.push({l:need,j:t.dataset.j});fixed++;paint()};
  $("#sk").onclick=()=>{stats.saltos++;addPen(20000);next()};
 };
 show();
}

/* ---------- CRUCIGRAMA ---------- */
function crucigrama(){
 const {w:W,h:H,words}=CRUCI;const sol={},num={};
 words.forEach((o,k)=>{o.cells=[];for(let i=0;i<o.w.length;i++){const r=o.r+(o.d==="d"?i:0),c=o.c+(o.d==="a"?i:0);sol[r+","+c]=o.w[i];o.cells.push(r+","+c)}num[o.r+","+o.c]=o.n});
 let st={err:0,pis:0},cur=0,pos=null;
 app.innerHTML=hud("crucigrama","3 palabras")+`<div class="card"><div class="cw" style="grid-template-columns:repeat(${W},1fr)">`+
  Array.from({length:W*H},(_,i)=>{const r=Math.floor(i/W),c=i%W,k=r+","+c;return sol[k]?`<div class="cl">${num[k]?`<span class="num">${num[k]}</span>`:""}<input data-k="${k}" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text"></div>`:`<div class="cl x"></div>`}).join("")+
  `</div><ul class="clues">${words.map((o,k)=>`<li data-w="${k}"><b>${o.n} ${o.d==="a"?"Horizontal":"Vertical"}</b> · ${o.clue} (${o.w.length})</li>`).join("")}</ul>
  <div class="row"><button class="btn sec" id="hn">Pista +5 s</button></div></div>`;
 const inp=k=>document.querySelector(`.cw input[data-k="${k}"]`);
 const all=[...document.querySelectorAll(".cw input")];
 const paint=()=>{all.forEach(e=>e.classList.remove("sel","cur"));words[cur].cells.forEach(k=>inp(k).classList.add("sel"));if(pos)inp(pos).classList.add("cur");document.querySelectorAll(".clues li").forEach((l,k)=>l.classList.toggle("on",k===cur))};
 const pick=(k,keep)=>{if(!keep){const ws=words.map((o,i)=>i).filter(i=>words[i].cells.includes(k));if(!ws.includes(cur))cur=ws[0];else if(pos===k&&ws.length>1)cur=ws.find(i=>i!==cur)}pos=k;paint();const e=inp(k);e.focus({preventScroll:true})};
 const step=dir=>{const cs=words[cur].cells;let i=cs.indexOf(pos)+dir;while(i>=0&&i<cs.length&&inp(cs[i]).classList.contains("ok"))i+=dir;if(i>=0&&i<cs.length)pick(cs[i],true)};
 const check=()=>{if(!all.every(e=>e.value))return;let bad=0;all.forEach(e=>{if(e.value.toUpperCase()===sol[e.dataset.k]){e.classList.add("ok");e.readOnly=true}else{bad++;e.classList.add("bad")}});
  if(!bad){setTimeout(()=>finish("crucigrama",{"Palabras":"3 de 3","Letras equivocadas":st.err+" (+"+st.err*3+" s)","Pistas":st.pis+" (+"+st.pis*5+" s)"},"3/3"),500);return}
  st.err+=bad;addPen(bad*3000);document.querySelector(".cw").classList.add("shake");
  setTimeout(()=>{document.querySelector(".cw").classList.remove("shake");all.forEach(e=>{if(e.classList.contains("bad")){e.value="";e.classList.remove("bad")}});const f=all.find(e=>!e.value);if(f)pick(f.dataset.k)},500)};
 all.forEach(e=>{
  e.addEventListener("focus",()=>{if(pos!==e.dataset.k)pick(e.dataset.k,words[cur].cells.includes(e.dataset.k))});
  e.addEventListener("click",()=>pick(e.dataset.k));
  e.addEventListener("input",()=>{if(e.readOnly)return;e.value=e.value.slice(-1).toUpperCase().replace(/[^A-ZÑ]/,"");if(e.value){step(1);check()}});
  e.addEventListener("keydown",ev=>{if(ev.key==="Backspace"&&!e.value&&!e.readOnly){ev.preventDefault();step(-1);const p=inp(pos);if(!p.readOnly)p.value=""}});
 });
 document.querySelectorAll(".clues li").forEach(l=>l.onclick=()=>{cur=+l.dataset.w;const cs=words[cur].cells;const f=cs.find(k=>!inp(k).value)||cs.find(k=>!inp(k).classList.contains("ok"))||cs[0];pick(f,true)});
 $("#hn").onclick=()=>{const k=words[cur].cells.find(k=>!inp(k).classList.contains("ok"));if(!k)return;st.pis++;addPen(5000);const e=inp(k);e.value=sol[k];e.classList.add("ok");e.readOnly=true;check();if(all.some(x=>!x.value))step(1)};
 startClock();pick(words[0].cells[0],true);
}
function confetti(){const cols=["#F2B705","#D7263D","#1B998B","#3A86FF","#fff"];for(let i=0;i<70;i++){const d=document.createElement("i");d.className="conf";d.style.left=Math.random()*100+"vw";d.style.background=cols[i%5];d.style.animationDuration=(1.6+Math.random()*1.6)+"s";d.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}}

/* ---------- RESULTADO ---------- */
function finish(g,detail,acc){
 const raw=stopClock();const total=Math.round((raw+penal)/100)*100;
 app.innerHTML=head("¡Reto completado!")+`<div class="card res">
 <div style="font-weight:700;color:var(--muted)">${esc(jugador)} · ${GAMES[g].nombre}</div>
 <div class="big">${fmt(total)}</div>
 <table>${Object.entries(detail).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>
 <a class="btn" id="reg" href="${linkForms(g,acc,total,detail)}" target="_blank" rel="noopener" style="text-decoration:none;font-size:18px">Registrar mi resultado</a>
 <p class="note" style="margin-top:6px">Se abre un formulario ya lleno: solo pulsa <b>Enviar</b>.</p>
 <a class="btn sec" href="#" style="text-decoration:none">Jugar otro reto</a></div>`;
 confetti();
}

route();
</script>
</body>
</html>
